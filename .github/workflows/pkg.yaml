name: PKG
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# purpose: Continuous Delivery (aka Packaging & Shipping)

on:
  push:
    branches:
      - main
    paths:
      - 'Directory.Build.props'
  workflow_dispatch:
    inputs:
      push-enabled:
        description: 'Push packages?'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  git-check:
    name: Git
    uses: devpro/github-workflow-parts/.github/workflows/reusable-git-check.yml@c6d06a61a377a41dc192ce58f08a0b5100d9a2bc
    with:
      workflow-parts-version: c6d06a61a377a41dc192ce58f08a0b5100d9a2bc

  package-publication:
    name: Package / Publication
    needs: git-check
    if: github.event_name == 'workflow_dispatch' || needs.git-check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Pack & push .NET projects
        uses: devpro/github-workflow-parts/actions/dotnet/pack-push@c6d06a61a377a41dc192ce58f08a0b5100d9a2bc
        with:
          registry-token: ${{ secrets.NUGET_API_KEY }}
          push-enabled: ${{ github.event_name != 'workflow_dispatch' || inputs.push-enabled }}
