# IstarCI configuration, read from the root of the repository.

runner:
  image: ghcr.io/devpro/ubuntu-dotnet:latest
  images:
    "git-check*": ghcr.io/devpro/debian-node:latest
    "markup-lint*": ghcr.io/devpro/debian-node:latest
  # The analysis runs against the SonarQube IstarCI starts on this machine, with a token made there.
  sonarqube: true

# Repository variables the pipeline reads, which a local run otherwise gets as placeholders.
vars:
  # FOSSA analyses on its own service with an API key, which a local run never holds.
  FOSSA_ENABLED: "false"
  # The local SonarQube has no organizations, and a non-empty one is what turns the analysis on.
  SONAR_ORG: local
  SONAR_PROJECT_KEY: withywoods
